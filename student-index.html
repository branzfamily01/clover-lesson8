<div class="app-shell" id="app" tabindex="0">
  <main class="stage" id="stage" aria-live="polite"></main>
  <nav class="toolbar" aria-label="学習操作">
    <button class="tool-btn" id="prevBtn" type="button" aria-label="前へ">←</button>
    <button class="tool-btn text" id="menuBtn" type="button" aria-label="問題一覧">☰ <span>問題</span></button>
    <button class="tool-btn text" id="mapBtn" type="button" aria-label="文法地図">🗺 <span>MAP</span></button>
    <div class="progress" aria-label="進行状況"><div class="counter" id="counter"></div><div class="progressbar"><span id="progressBar"></span></div></div>
    <div class="voice">
      <label>Voice <select id="voiceMode"><option value="auto">Auto</option><option value="en-US">US</option><option value="en-GB">UK</option></select></label>
      <label>Speed <span id="rateValue">1.0</span> <input class="rate" id="rate" type="range" min="0.7" max="3" step="0.1" value="1.0"></label>
    </div>
    <button class="tool-btn" id="resetBtn" type="button" aria-label="この問題を最初から">↺</button>
    <button class="tool-btn primary" id="nextBtn" type="button" aria-label="次へ">→</button>
  </nav>
</div>
<div class="overlay" id="menuOverlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-label="問題一覧"><header class="modal-head"><h2>Clover Lesson 8｜問題一覧</h2><button class="close-btn" id="menuClose" type="button">×</button></header><div class="modal-body" id="menuBody"></div></section></div>

<div class="toast" id="toast" hidden></div>
