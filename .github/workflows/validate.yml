name: Validate Clover Lesson 8
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check lesson-data.js
          node --check lesson-data-v1.js
          node --check lesson-references-v1.js
          node --check lesson08-learning-v1.js
          node --check lesson08-enhance-v1.js
          node --check validate.cjs
      - name: Clover Lesson8 Engine v1 contract
        run: node validate.cjs
