name: Validate Clover Lesson 8
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check lesson-data.js
          node --check lesson8-output-defaults.js
          node --check lesson-data-adapter.js
          node --check lesson-references.js
          node --check lesson08-learning.js
          node --check lesson08-enhance.js
          node --check validate.cjs
      - name: Clover lesson contract
        run: node validate.cjs
